name: deboetapi

# Deployed to the VPS alongside a .env holding POSTGRES_PASSWORD, JWT_SIGNING_KEY,
# CORS_ORIGIN and IMAGE_TAG.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    image: ${IMAGE:?set IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: >-
        Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Database__MigrateOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-deboetapi-api}
      Jwt__Audience: ${JWT_AUDIENCE:-deboetapi-clients}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:?set CORS_ORIGIN}
      Proxy__TrustForwardedHeaders: "true"
      Admin__Password: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      OpenApi__Enabled: ${OPENAPI_ENABLED:-false}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - api-logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8080
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      SITE_URL: ${SITE_URL:-https://www.deboet.nl}
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  api-logs:
  caddy-data:
  caddy-config:
