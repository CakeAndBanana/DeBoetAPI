name: Build & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/deboetapi-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/DeBoetAPI/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Must match the GitHub Environment holding VPS_HOST / VPS_USER / VPS_SSH_KEY /
    # VPS_APP_DIR. Environment secrets are invisible to jobs that do not name it, and a
    # mismatch fails as an empty host rather than a missing-environment error.
    environment: OVHCloud
    permissions:
      # Needed to pull the image from GHCR when the repository is private.
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # No script_stop: the action dropped that input. `set -euo pipefail` below is what
          # actually aborts the script on the first failing command.
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_APP_DIR }}

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f compose.prod.yaml pull
            docker compose -f compose.prod.yaml up -d --remove-orphans

            # Gate the job on the app actually coming back up, not just on compose exiting 0.
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8080/health/ready > /dev/null; then
                echo "API healthy after ${i} attempt(s)."
                docker image prune -f
                exit 0
              fi
              sleep 2
            done

            echo "API did not become healthy; recent logs:"
            docker compose -f compose.prod.yaml logs --tail 100 api
            exit 1
