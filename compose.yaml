name: deboetapi

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deboetapi}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Exposed locally so Rider / psql can connect directly. Not published in prod.
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-deboetapi}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: src/DeBoetAPI/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-deboetapi};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Database__MigrateOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-only-signing-key-not-for-production-use-32b}
      Jwt__Issuer: deboetapi-api
      Jwt__Audience: deboetapi-clients
      Cors__AllowedOrigins__0: http://localhost:3000
      Cors__AllowedOrigins__1: http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      # Bind mount locally so the daily files are just there in the repo to open. Docker
      # Desktop is permissive about ownership; on Linux see the note in compose.prod.yaml.
      - ./logs:/app/logs

volumes:
  db-data:
